name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Publish button: Actions -> Build and Release -> Run workflow (branch: main).
  # Builds main and publishes it as the release named by launcher/version.go, marked Latest.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to build main and publish it as the new Latest release'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the publish request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != "publish" ]; then
            echo 'Type "publish" in the confirm box to release.' >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases are published from main only (got $GITHUB_REF)." >&2
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Enforce repository layout
        run: python scripts/check_layout.py
      - name: Launcher/updater source checks
        run: go test ./launcher/updater
      - name: Browser source checks
        if: ${{ hashFiles('web/js/app.js', 'web/js/duel-core.js') != '' }}
        run: |
          node --check web/js/app.js
          node --check web/js/duel-core.js
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Prepare verified recovered source with current checkout
        if: ${{ hashFiles('base/*.exe') == '' }}
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/rc241-source.zip" "https://github.com/TechSavage1989/YGO-Deck-Studio/releases/download/v3.0.0-alpha.221-duelcore.1-rc241/YGO_Deck_Studio_3_v3.0.0-alpha.221-duelcore.1-rc241_Source_Chat.zip"
          python scripts/prepare_recovered_source.py --snapshot "$RUNNER_TEMP/rc241-source.zip" --out "$RUNNER_TEMP/ygo-complete"
          python "$RUNNER_TEMP/ygo-complete/scripts/build_release.py" --out "$GITHUB_WORKSPACE/dist"
      - name: Full release build when recovered baseline is available
        if: ${{ hashFiles('base/*.exe') != '' }}
        run: python scripts/build_release.py --out dist
      - name: Rebuild extracted complete Source ZIP
        run: python scripts/check_source_package.py
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('dist/*') != '' }}
        with:
          name: ygo-deck-studio-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
      - name: Refuse release without build artifacts
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && hashFiles('dist/*') == '' }}
        run: |
          echo "Release build requires the verified recovered rc189 baseline executable." >&2
          exit 1
      - name: Create immutable GitHub release
        if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && hashFiles('dist/*') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(sed -n 's/.*AppVersion *= *"\([^"]*\)".*/\1/p' launcher/version.go | head -n 1)"
            if [ -z "$VERSION" ]; then
              echo "Could not read the version from launcher/version.go." >&2
              exit 1
            fi
            TAG="v${VERSION}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag $TAG already exists; bump the release candidate before publishing again." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # A tag on the wrong commit must never publish a mislabeled release.
          if ! grep -q "\"tag\": \"${TAG}\"" dist/update-manifest.json; then
            echo "The built manifest does not match $TAG; refusing to publish." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "YGO Deck Studio $TAG" --latest --generate-notes
